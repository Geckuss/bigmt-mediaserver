# Komodo resource declarations. This file is the source of truth for Komodo
# resources; the UI is locked read-only once this is authoritative
# (ui_write_disabled), so nothing can drift from git.
#
# Only NON-SECRET values belong here. Real credentials live in the root-only
# core.config.toml [secrets] block on the host. See the secrets section of
# agents.md.
#
# Every variable a stack references with [[VAR]] must be declared below, or it
# is invisible to this file. The secret variables (IMMICH_DB_PASSWORD,
# SEAFILE_DB_PASSWORD, SEAFILE_ADMIN_PASSWORD) are deliberately NOT declared:
# they exist in Komodo and the sync must leave them alone. That is what
# delete_unmatched = false protects -- turning it on would delete all three
# and break every deploy on an unresolved [[VAR]].

[[variable]]
name = "DATA"
value = "/data"

[[variable]]
name = "CONFIGS"
value = "/data/backups/configs"

[[variable]]
name = "TZ"
value = "Europe/Helsinki"

# --- bigmt -------------------------------------------------------------------

[[server]]
name = "bigmt"
description = "main mediaserver: docker host for every stack"
tags = ["prod"]
enabled = true
  [server.config]
  # Outbound Periphery dials this address. It is the tailnet URL rather than
  # komodo.bigmt.top on purpose: Periphery keeps working when oci, Caddy or the
  # internet is down, and avoids a hairpin on every command.
  address = "http://bigmt.tahr-fort.ts.net:9120"
  region = "Helsinki"
  tags = ["prod"]
  internet_interface = "tailscale0"

# --- stacks -------------------------------------------------------------------
#
# Only stacks Komodo actually manages are declared here: the sync CREATES
# anything it finds, so listing an unmigrated stack would spawn an empty one.
# Still to migrate: vocard, valheim, v_rising.
#
# project_name is deliberately left empty everywhere, so it defaults to the
# stack name and adopts the running compose project instead of recreating it.
# Leave it that way unless you also stop the old project by hand.

[[stack]]
name = "mediastack"
description = "the 11 *arr + seafile services that actually interact"
tags = ["prod", "media"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/docker-compose.yml"]
  # Required: compose does NOT remove services dropped from the file without
  # this flag, it only reports them as orphans. Needed when moving services
  # between stacks.
  extra_args = ["--remove-orphans"]
  poll_for_updates = true
  environment = """
    DATA = [[DATA]]
    CONFIGS = [[CONFIGS]]
    TZ = [[TZ]]
    UPLOAD_LOCATION = /data/media/gallery
    SEAFILE_HOSTNAME = seafile.bigmt.top
    SEAFILE_ADMIN_EMAIL = <redacted>
    SEAFILE_MYSQL_ROOT_PASSWORD = [[SEAFILE_DB_PASSWORD]]
    SEAFILE_ADMIN_PASSWORD = [[SEAFILE_ADMIN_PASSWORD]]
  """

[[stack]]
name = "infrastructure"
description = "pihole, uptime-kuma, scrutiny - kept out of mediastack on purpose"
tags = ["prod", "infra"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/infrastructure.yml"]
  poll_for_updates = true
  environment = """
    DATA = [[DATA]]
    CONFIGS = [[CONFIGS]]
    TZ = [[TZ]]
    UPLOAD_LOCATION = /data/media/gallery
  """

[[stack]]
name = "backrest"
description = "own project: start is gated on the backup drive being mounted"
tags = ["prod", "backup"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/backrest.yml"]
  poll_for_updates = true
  environment = """
    DATA = [[DATA]]
    CONFIGS = [[CONFIGS]]
    TZ = [[TZ]]
    UPLOAD_LOCATION = /data/media/gallery
  """

[[stack]]
name = "homepage"
description = "dashboard + host metrics"
tags = ["prod", "infra"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/homepage.yml"]
  poll_for_updates = true
  links = ["https://bigmt.top"]
  environment = """
    DATA = [[DATA]]
    CONFIGS = [[CONFIGS]]
    TZ = [[TZ]]
    HOMEPAGE_PORT = 3000
    HOMEPAGE_ALLOWED_HOSTS = *
  """

[[stack]]
name = "immich"
description = "photos: server + ML + valkey + postgres"
tags = ["prod", "photos"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/immich.yml"]
  poll_for_updates = true
  links = ["https://immich.bigmt.top"]
  environment = """
    UPLOAD_LOCATION = /data/media/gallery
    DB_DATA_LOCATION = /data/backups/configs/immich-config/postgres
    DB_PASSWORD = [[IMMICH_DB_PASSWORD]]
    DB_USERNAME = postgres
    DB_DATABASE_NAME = immich
  """

# --- the sync itself ---------------------------------------------------------
#
# Deliberately NOT declared as a [[resource_sync]] block here. This file is
# read BY that sync, so declaring it would be self-referential. It is created
# out of band, once, in the Komodo UI or API:
#
#   name          bigmt
#   repo          Geckuss/bigmt-mediaserver
#   branch        master
#   resource_path ["komodo/resources.toml"]
#   delete_unmatched   false   <- keep false; see the note at the top
#   ui_write_disabled false   <- flip to true once the diffs look boring
#
# Because GitHub cannot reach a tailnet-only Core, the sync webhook will never
# fire. Core polls the repo instead (resource_poll_interval, 1 hour by default),
# or you run it by hand.

