# Komodo resource declarations. This file is the source of truth for Komodo
# resources; the UI is locked read-only once this is authoritative
# (ui_write_disabled), so nothing can drift from git.
#
# Only NON-SECRET values belong here. Real credentials live in the root-only
# core.config.toml [secrets] block on the host. See the secrets section of
# agents.md.
#
# Every variable a stack references with [[VAR]] must be declared below, or it
# is invisible to this file. The secret variables (IMMICH_DB_PASSWORD,
# SEAFILE_DB_PASSWORD, SEAFILE_ADMIN_PASSWORD) are deliberately NOT declared:
# they exist in Komodo and the sync must leave them alone. That is what
# delete_unmatched = false protects -- turning it on would delete all three
# and break every deploy on an unresolved [[VAR]].

[[variable]]
name = "DATA"
value = "/data"

[[variable]]
name = "CONFIGS"
value = "/data/backups/configs"

[[variable]]
name = "TZ"
value = "Europe/Helsinki"

# --- bigmt -------------------------------------------------------------------

[[server]]
name = "bigmt"
description = "main mediaserver: docker host for every stack"
tags = ["prod"]
  [server.config]
  # MUST live inside [server.config]. At the [[server]] level it is parsed as
  # an unknown top-level key and silently dropped, which would leave the
  # server disabled and Periphery unmanaged.
  enabled = true
  # address MUST stay unset. It is the address CORE dials to reach Periphery,
  # so setting it flips the server into inbound mode and Core then tries to
  # connect to Periphery itself. This host runs Periphery in outbound mode:
  # Periphery dials Core, and that dial target lives in Periphery's own
  # /etc/komodo/periphery.config.toml as core_addresses, not here.
  region = "Helsinki"

# --- stacks -------------------------------------------------------------------
#
# Only stacks Komodo actually manages are declared here: the sync CREATES
# anything it finds, so listing an unmigrated stack would spawn an empty one.
# Every Komodo-managed stack is declared below; the only omission is komodo's
# own, which is hand-deployed and must not be managing itself.
#
# project_name is deliberately left empty everywhere, so it defaults to the
# stack name and adopts the running compose project instead of recreating it.
# Leave it that way unless you also stop the old project by hand.

[[stack]]
name = "mediastack"
description = "jellyfin + the *arr chain + downloads - they talk over host ports, not compose DNS"
tags = ["prod", "media"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/docker-compose.yml"]
  auto_pull = false
  # Required: compose does NOT remove services dropped from the file without
  # this flag, it only reports them as orphans. Needed when moving services
  # between stacks -- this is how the seafile trio was reaped from here.
  extra_args = ["--remove-orphans"]
  poll_for_updates = true
  links = ["https://jellyfin.bigmt.top", "https://radarr.bigmt.top", "https://sonarr.bigmt.top", "https://qbittorrent.bigmt.top"]
  environment = """
DATA = [[DATA]]
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
UPLOAD_LOCATION = /data/media/gallery
  """

[[stack]]
name = "seafile"
description = "seafile + mariadb + memcached - own project, the three are coupled by service name"
tags = ["prod", "files"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/seafile.yml"]
  auto_pull = false
  # Same reason as mediastack: the trio moves as a unit, and a future split of
  # it should reap orphans rather than leave them running unowned.
  extra_args = ["--remove-orphans"]
  poll_for_updates = true
  links = ["https://seafile.bigmt.top"]
  # Every field must be declared on a new stack. The sync is a PARTIAL merge:
  # anything absent here is rewritten to the schema default, and for a stack
  # that did not exist before, "absent" means "empty".
  environment = """
DATA = [[DATA]]
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
SEAFILE_PORT = 8082
SEAFILE_HOSTNAME = seafile.bigmt.top
SEAFILE_ADMIN_EMAIL = [[SEAFILE_ADMIN_EMAIL]]
SEAFILE_MYSQL_ROOT_PASSWORD = [[SEAFILE_DB_PASSWORD]]
SEAFILE_ADMIN_PASSWORD = [[SEAFILE_ADMIN_PASSWORD]]
  """

[[stack]]
name = "infrastructure"
description = "pihole, uptime-kuma, scrutiny - kept out of mediastack on purpose"
tags = ["prod", "infra"]
  [stack.config]
  server = "bigmt"
  links = ["https://pihole.bigmt.top", "https://uptime.bigmt.top", "https://scrutiny.bigmt.top"]
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/infrastructure.yml"]
  auto_pull = false
  poll_for_updates = true
  environment = """
DATA = [[DATA]]
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
UPLOAD_LOCATION = /data/media/gallery
# Bootstrap only. pihole v6 hashes this into pihole.toml as `pwhash` on first
# start and then ignores WEBPASSWORD on every start after that, so the live
# password is the hash already in etc-pihole/pihole.toml, not this value. It
# is wired up so that rebuilding pihole from scratch cannot come up with NO
# admin password on the LAN.
PIHOLE_PASSWORD = [[PIHOLE_PASSWORD]]
  """

[[stack]]
name = "backrest"
description = "own project: start is gated on the backup drive being mounted"
tags = ["prod", "backup"]
  [stack.config]
  server = "bigmt"
  links = ["https://backrest.bigmt.top"]
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/backrest.yml"]
  auto_pull = false
  poll_for_updates = true
  environment = """
DATA = [[DATA]]
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
UPLOAD_LOCATION = /data/media/gallery
  """

[[stack]]
name = "homepage"
description = "dashboard + host metrics"
tags = ["prod", "infra"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/homepage.yml"]
  auto_pull = false
  poll_for_updates = true
  links = ["https://bigmt.top"]
  environment = """
DATA = [[DATA]]
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
HOMEPAGE_PORT = 3000
HOMEPAGE_ALLOWED_HOSTS = *
  """

[[stack]]
name = "immich"
description = "photos: server + ML + valkey + postgres"
tags = ["prod", "photos"]
  [stack.config]
  server = "bigmt"
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/immich.yml"]
  auto_pull = false
  poll_for_updates = true
  links = ["https://immich.bigmt.top"]
  environment = """
UPLOAD_LOCATION = /data/media/gallery
DB_DATA_LOCATION = /data/backups/configs/immich-config/postgres
DB_PASSWORD = [[IMMICH_DB_PASSWORD]]
DB_USERNAME = postgres
DB_DATABASE_NAME = immich
  """

[[stack]]
name = "vocard"
description = "Discord music bot, with its own Lavalink, yt-cipher and spotify-tokener"
tags = ["prod", "bot"]
  [stack.config]
  server = "bigmt"
  links = ["https://seraphine.bigmt.top"]
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/vocard.yml"]
  # Pinned image, no pull on deploy: the bot's version should be a deliberate
  # bump, not whatever was published that morning. First deploy pulls because
  # the image is absent locally, later deploys reuse it.
  auto_pull = false
  poll_for_updates = true
  # Bumps the Lavalink plugin jars in ${CONFIGS} after each deploy.
  environment = """
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
"""

[[stack]]
name = "vrising"
description = "V Rising, BepInEx modded, from a locally built image"
tags = ["prod", "games"]
  [stack.config]
  server = "bigmt"
  links = []
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/vrising.yml"]
  # The image is built on the host from configs/vrising/Dockerfile and exists
  # in no registry, so auto_pull would fail outright. Nothing to poll either.
  auto_pull = false
  auto_update = false
  poll_for_updates = false
  environment = """
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
"""

[[stack]]
name = "valheim"
description = "Valheim, BepInEx modded"
tags = ["prod", "games"]
  [stack.config]
  server = "bigmt"
  links = []
  repo = "Geckuss/bigmt-mediaserver"
  branch = "master"
  file_paths = ["stacks/valheim.yml"]
  # The image is untagged, so it resolves to :latest. Leaving auto_pull on
  # would let a routine deploy silently pull a newer server build.
  auto_pull = false
  poll_for_updates = true
  environment = """
CONFIGS = [[CONFIGS]]
TZ = [[TZ]]
# These four were carried over from the old Portainer stack.env, NOT from the
# compose file, whose defaults are WORLD_REDACTED/2456/2457. Leaving them out would
# silently switch the server to a different world on the first deploy.
VALHEIM_SERVER_NAME = WORLD_REDACTED
VALHEIM_WORLD_NAME = WORLD_REDACTED
VALHEIM_GAME_PORT = 2456
VALHEIM_QUERY_PORT = 2457
VALHEIM_SERVER_PASS = [[VALHEIM_SERVER_PASS]]
# A SteamID, so treated as a secret rather than committed.
VALHEIM_ADMINLIST_IDS = [[VALHEIM_ADMINLIST_IDS]]
"""

# --- the sync itself ---------------------------------------------------------
#
# Deliberately NOT declared as a [[resource_sync]] block here. This file is
# read BY that sync, so declaring it would be self-referential. It is created
# out of band, once, in the Komodo UI or API:
#
#   name          bigmt
#   repo          Geckuss/bigmt-mediaserver
#   branch        master
#   resource_path ["komodo/resources.toml"]
#   delete_unmatched   false   <- keep false; see the note at the top
#   ui_write_disabled false   <- flip to true once the diffs look boring
#
# Because GitHub cannot reach a tailnet-only Core, the sync webhook will never
# fire. Core polls the repo instead (resource_poll_interval, 1 hour by default),
# or you run it by hand.

