name: secret-scan

# This repository is public. Nothing that reaches master may contain a real
# credential. The local .githooks/pre-commit runs the same check before commit;
# this job is the backstop for pushes made from anywhere else.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Sanity check that the committed compose files still parse and that the
  # variable contract in .env.example covers what the stacks reference.
  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          set -euo pipefail
          for f in stacks/*.yml; do
            echo "::group::$f"
            # Unset variables only produce warnings; we care about YAML errors.
            docker compose -f "$f" config -q 2>&1 | grep -v 'level=warning' || true
            echo "::endgroup::"
          done
