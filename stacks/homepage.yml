services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - ${HOMEPAGE_PORT:-3000}:3000
    volumes:
      - ${CONFIGS}/homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA}:/data:ro
    environment:
      - TZ=${TZ:-Europe/Helsinki}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-bigmt.example.com,homepage.example.com}
    # lets Homepage reach the host-network Glances at host.docker.internal:61208
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  glances:
    # The official image, not the glibc rebuild that used to live here.
    # That rebuild existed only because the nvidia runtime injects a glibc
    # libnvidia-ml.so that the musl/Alpine official image cannot dlopen, and the
    # only widget that needed NVML was a GPU tile. There is no GPU tile, so the
    # rebuild bought nothing and cost a hand-built image in no registry (which is
    # also what made `docker compose pull` fail on this stack).
    # Verified equivalent for every widget the dashboard actually uses - cpu,
    # memory, fs:/data, CPU temp (sensors), network and disk all report the same
    # values - and the official image does honour the mounted glances.conf.
    image: nicolargo/glances:4.5.7-full
    container_name: glances
    # host mode gives real per-interface network stats (incl. tailscale0) + host sensors
    network_mode: host
    pid: host
    environment:
      - TZ=${TZ:-Europe/Helsinki}
      # run the web/API server on :61208
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      # read-only mount so Glances can report host data-drive usage (fs:/data tile)
      - ${DATA}:/data:ro
      # locks down the web API: Host header allowlist + no CORS. Without it
      # Glances warns and leaves /api/4/all readable by anything on the LAN.
      - ${CONFIGS}/glances/glances.conf:/etc/glances/glances.conf:ro
    restart: unless-stopped
