# Infrastructure: the services that keep the house running, deliberately kept
# out of stacks/docker-compose.yml so a workload deploy cannot restart them.
#
#   pihole        LAN DNS. If this is down, name resolution dies for everything
#                 including whatever you are currently deploying.
#   uptime-kuma   monitoring. Down exactly when you need to see what broke.
#   scrutiny      disk SMART on the two 7.3T data drives.
#
# backrest also used to live here but has its own project (stacks/backrest.yml),
# because its backup drives are only present sometimes and its start has to be
# gated on the mount by a host-side script.
#
# Deploy order matters: after moving these out of mediastack, deploy
# docker-compose.yml FIRST (it removes them from that project), then this one.

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: host
    # FTL raises its own priority to -10 (misc.nice) so DNS stays responsive
    # under load, but without CAP_SYS_NICE the raise fails and it logs
    # "process priority remains at 0" at every start. It also backs off recursion
    # when the 15min load average exceeds nproc, so on a busy host this is the
    # difference between DNS degrading gracefully and not.
    #
    # Only SYS_NICE. FTL also wants CAP_SYS_TIME for its NTP client, but that
    # capability can set the system clock and is not worth granting just to
    # validate upstream timestamps. FTL logs the omission and carries on.
    cap_add:
      - SYS_NICE
    environment:
      - TZ=${TZ:-Europe/Helsinki}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - WEB_PORT=${PIHOLE_WEBUI:-8089}
      - DNSMASQ_LISTENING=all
    volumes:
      - ${CONFIGS}/pihole/etc-pihole:/etc/pihole
      - ${CONFIGS}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - ${UPTIME_KUMA_PORT:-3001}:3001
    volumes:
      - ${CONFIGS}/uptime-kuma:/app/data
    restart: unless-stopped

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO
    ports:
      - ${SCRUTINY_PORT:-8079}:8080
    volumes:
      - /run/udev:/run/udev:ro
      - ${CONFIGS}/scrutiny/config:/opt/scrutiny/config
      - ${CONFIGS}/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      # by-id paths, not /dev/sdX letters: the 12TB USB dock was once sda, and
      # it re-surfaced as sdd after the ZFS migration. serially pinned.
      - /dev/disk/by-id/ata-Samsung_SSD_860_EVO_250GB_S4CJNZFN111443J   # boot SSD
      - /dev/disk/by-id/ata-ST8000VX004-2M1101_WSD6B0H7                 # 8TB mirror
      - /dev/disk/by-id/ata-ST8000VX004-2M1101_WSD64YYC                 # 8TB mirror
    environment:
      - TZ=${TZ:-Europe/Helsinki}
    restart: unless-stopped
