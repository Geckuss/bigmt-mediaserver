name: vocard
networks:
  vocard:
    name: vocard
services:
  lavalink:
    container_name: lavalink
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      - _JAVA_OPTIONS=-Xmx512M -XX:+UseG1GC -XX:MaxGCPauseMillis=20
    expose:
      - 2333
    image: ghcr.io/lavalink-devs/lavalink:latest
    networks:
      - vocard
    restart: unless-stopped
    # Without this, vocard races the node: it connects at t+0, Lavalink is only
    # listening at ~t+4, and v2.7.3 does not retry. The bot then sits there
    # unable to play anything while looking perfectly healthy in the UI.
    # Uses bash /dev/tcp rather than `nc -z`: the Lavalink image has no netcat,
    # which would make the check fail forever and block vocard on
    # service_healthy. A TCP connect is also the right test - it is precisely
    # what vocard's node client needs.
    healthcheck:
      test: [ "CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2333' || exit 1" ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    volumes:
      - ${CONFIGS}/vocard/lavalink/application.yml:/opt/Lavalink/application.yml
      - ${CONFIGS}/vocard/lavalink/plugins:/opt/Lavalink/plugins
      - ${CONFIGS}/vocard/lavalink/logs:/opt/Lavalink/logs

  yt-cipher:
    container_name: yt-cipher
    image: ghcr.io/kikkia/yt-cipher:master
    expose:
      - 8001
    networks:
      - vocard
    restart: unless-stopped

  spotify-tokener:
    container_name: spotify-tokener
    environment:
      - SPOTIFY_TOKENER_ADDR=0.0.0.0:49152
    expose:
      - 49152
    image: ghcr.io/topi314/spotify-tokener:master
    networks:
      - vocard
    restart: unless-stopped

  vocard-dashboard:
    container_name: vocard-dashboard
    image: ghcr.io/chocomeow/vocard-dashboard:latest
    restart: unless-stopped
    volumes:
      - ${CONFIGS}/vocard/dashboard/settings.json:/app/settings.json
    ports:
      - 8050:8000
    networks:
      - vocard

  vocard:
    container_name: vocard
    depends_on:
      vocard-db:
        condition: service_healthy
      lavalink:
        # was service_started, which fires long before Lavalink can accept a
        # node connection. See the healthcheck above.
        condition: service_healthy
    # Was built locally as vocard:beta (v2.7.3b3) to get a Voicelink fix for
    # Lavalink 4.2.x ahead of a stable release. v2.7.3 shipped 2026-05-09 and
    # includes the Voicelink refactor, so the local build is redundant.
    # Pinned rather than :latest, so the tag always says what is running.
    # Lavalink is a separate service below, which is what 2.7.3 now expects:
    # it dropped the bundled Docker-based Lavalink setup.
    image: ghcr.io/chocomeow/vocard:v2.7.3
    networks:
      - vocard
    restart: unless-stopped
    volumes:
      - ${CONFIGS}/vocard/settings.json:/app/settings.json

  vocard-db:
    command:
      - mongod
      - --oplogSize=1024
      - --wiredTigerCacheSizeGB=1
      - --auth
      - --noscripting
    container_name: vocard-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${VOCARD_MONGO_ROOT_PASSWORD:?VOCARD_MONGO_ROOT_PASSWORD must be set}
    expose:
      - 27017
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      timeout: 5s
    # Pinned to the exact patch, not a floating tag. `mongo:8` moved to 8.3.11 on
    # 2026-09-16, and 8.3.x carries a startup guard that hard-exits mongod on
    # Linux kernel >= 6.19 (SERVER-121912). This host runs 7.0.0-31-generic, so
    # the stack crash-looped from the moment the container was recreated on
    # 2026-09-28 and the bot lost its database.
    #
    # The guard is a false positive here, and the pin is deliberate rather than
    # a rollback. The underlying bug is a TCMalloc/rseq ABI break in kernel
    # 6.19. The kernel-side fix (Gleixner's "rseq: Revert to historical
    # performance killing behaviour") is in Ubuntu 7.0.0-28+, so this x86_64 host
    # already has it; the allocator is sound. MongoDB's check just parses
    # "7.0.0-31" as 7.0.0, sees it below 7.0.14, and refuses to start. That is
    # MongoDB's own bug, SERVER-131779, fixed in 8.0.35 / 8.3.14 / 9.0.3. At the
    # time of writing 8.3.14 was not yet published, so there is no newer image
    # that both contains the fix and can be had.
    #
    # This is also an exact match for the data: 8.2.12 is the build that wrote
    # mongodb_data, and the 8.3.11 container never got far enough to touch it, so
    # there is no version migration in either direction. Revisit once the host
    # is back on a kernel below 6.19, at which point any current mongod works.
    image: mongo:8.2.12
    networks:
      - vocard
    restart: unless-stopped
    volumes:
      - ${CONFIGS}/vocard/mongodb_data:/data/db
      # mongo's image declares VOLUME /data/configdb. Without an explicit mount
      # here it becomes an anonymous volume, and recreating this container
      # orphans it and starts a fresh one. Upstream pins this too.
      - ${CONFIGS}/vocard/mongodb_conf:/data/configdb
