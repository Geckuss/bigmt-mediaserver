# Backrest, in its own project on purpose.
#
# The host guard verifies the 12TB mount's UUID and writeability before
# startup or deployment. A directory existing is not proof of a mounted disk.
# Install scripts/backrest-guard.sh at /usr/local/sbin/backrest-guard.sh and
# store the expected filesystem UUID in /etc/backrest-disk.uuid (host only).
# After plugging it in: sudo mount /mnt/backup-12tb, then start the guard.
# Old repos stay in Backrest's config but are deliberately not mounted.

services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    # Intentionally NOT "unless-stopped": the guard owns this lifecycle.
    restart: "no"
    cpus: 1.0
    cpu_shares: 2
    # Keep the original entrypoint, but make every child inherit nice +19
    # and idle I/O, including restic backup, check, prune and restore.
    entrypoint: ["/sbin/tini", "--", "nice", "-n", "19", "ionice", "-c", "3", "/docker-entrypoint"]
    command: ["/backrest"]
    ports:
      - ${BACKREST_PORT:-9898}:9898
    volumes:
      - ${CONFIGS}/backrest/data:/data
      - ${CONFIGS}/backrest/config:/config
      - ${CONFIGS}/backrest/cache:/cache
      # Sources (read-only)
      - ${CONFIGS}:/userdata/configs:ro
      - ${UPLOAD_LOCATION}:/userdata/immich-uploads:ro
      - ${DATA}/media:/userdata/media:ro
      - type: bind
        source: /mnt/backup-12tb/restic-backrest
        target: /repos/12tb
        bind:
          create_host_path: false
    # Prevent unavailable legacy repos from initializing on the root disk.
    tmpfs:
      - /repos:ro,size=1m
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - RESTIC_COMPRESSION=off
      - GOMAXPROCS=1
      - RESTIC_READ_CONCURRENCY=1
