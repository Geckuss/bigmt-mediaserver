# Backrest, in its own project on purpose.
#
# No guard and no gating: mount the disk you want to back up, then start the
# stack whenever you want. Two conventions do the job the old guard did:
#
#   * The repositories are bound from the disk MOUNTPOINTS, not from repo
#     subdirectories. A mountpoint always exists, so an absent disk shows up as
#     an empty directory and Docker never creates a repo path on the root SSD.
#   * autoInitialize is OFF for every repo, so an empty directory is a loud
#     "repository not initialised" error rather than a brand-new repository that
#     reports every plan as successful.
#
# Old 1TB repos stay in Backrest's config but are not mounted; the read-only
# /repos tmpfs is what stops them initialising onto container or root storage.

services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    # Survives a reboot. Stop it (docker stop / Komodo) and it stays stopped.
    restart: unless-stopped
    cpus: 1.0
    cpu_shares: 2
    # Keep the original entrypoint, but make every child inherit nice +19
    # and idle I/O, including restic backup, check, prune and restore.
    entrypoint: ["/sbin/tini", "--", "nice", "-n", "19", "ionice", "-c", "3", "/docker-entrypoint"]
    command: ["/backrest"]
    ports:
      - ${BACKREST_PORT:-9898}:9898
    volumes:
      - ${CONFIGS}/backrest/data:/data
      - ${CONFIGS}/backrest/config:/config
      - ${CONFIGS}/backrest/cache:/cache
      # Sources (read-only)
      - ${CONFIGS}:/userdata/configs:ro
      - ${UPLOAD_LOCATION}:/userdata/immich-uploads:ro
      - ${DATA}/media:/userdata/media:ro
      # Repositories (rw). The 12 TB repo is a directory on the disk, the 5 TB
      # repo is the disk root itself (its historical layout), so the two repo
      # URIs differ: /repos/12tb/restic-backrest and /repos/5tb.
      - /mnt/backup-12tb:/repos/12tb
      - /mnt/backup-5tb:/repos/5tb
    # Prevent unavailable legacy repos from initializing on the root disk.
    tmpfs:
      - /repos:ro,size=1m
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - RESTIC_COMPRESSION=off
      - GOMAXPROCS=1
      - RESTIC_READ_CONCURRENCY=1
