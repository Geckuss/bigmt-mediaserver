# Media: the *arr chain plus Jellyfin, qBittorrent and HandBrake. They reach
# each other over published host ports, not compose DNS, which is what makes
# this group splittable at all.
#
# seafile used to live here and now has its own project (stacks/seafile.yml).
# It was only ever a guest: its MariaDB and Memcached are used by service name
# from inside the trio, and the reverse proxy reaches it on host port 8082.
#
# CUTOVER ORDER: the first deploy of this file after the split reaps the three
# seafile containers via --remove-orphans. stacks/seafile.yml cannot start
# before that happens (fixed container_name), so deploy this one first.

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: host  # jellyfin benefits from host mode for DLNA/auto-discovery
    volumes:
    - ${DATA}/media:/media
    - ${CONFIGS}/jellyfin-config:/config
    - ${CONFIGS}/jellyfin-cache:/cache
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL}
    extra_hosts:
      - host.docker.internal:host-gateway
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Helsinki}
    volumes:
      - ${DATA}:/data
      - ${CONFIGS}/radarr-config:/config
      - ${CONFIGS}/extract-subs.sh:/scripts/extract-subs.sh:ro
      - ${CONFIGS}/install-ffmpeg.sh:/custom-cont-init.d/install-ffmpeg.sh:ro
    ports:
      - ${RADARR_PORT:-7878}:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Helsinki}
    volumes:
      - ${DATA}:/data
      - ${CONFIGS}/sonarr-config:/config
      - ${CONFIGS}/extract-subs.sh:/scripts/extract-subs.sh:ro
      - ${CONFIGS}/install-ffmpeg.sh:/custom-cont-init.d/install-ffmpeg.sh:ro
    ports:
      - ${SONARR_PORT:-8989}:8989
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Helsinki}
    volumes:
      - ${DATA}:/data
      - ${CONFIGS}/bazarr-config:/config
    ports:
      - ${BAZARR_PORT:-6767}:6767
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-Europe/Helsinki}
    ports:
      - 5055:5055
    volumes:
      - ${CONFIGS}/jellyseerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Helsinki}
    volumes:
      - ${CONFIGS}/prowlarr-config:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Helsinki}
      - WEBUI_PORT=${QBITTORRENT_WEBUI}
    volumes:
      - ${DATA}/downloads:/data/downloads
      - ${CONFIGS}/qbittorrent-config:/config
    ports:
      - ${QBITTORRENT_WEBUI:-8080}:8080
      - ${QBITTORRENT_PEER_TCP:-6881}:6881
      - ${QBITTORRENT_PEER_UDP:-6881}:6881/udp
    restart: unless-stopped

  handbrake:
    image: jlesage/handbrake
    container_name: handbrake
    ports:
      - ${HANDBRAKE_WEBUI:-5800}:5800
    volumes:
      - ${DATA}/downloads:/data/downloads
      - ${CONFIGS}/handbrake-config:/config:rw
      - ${DATA}/downloads:/storage:ro
      - ${DATA}/downloads/handbrake/input:/watch:rw
      - ${DATA}/downloads/handbrake/output:/output:rw
    restart: unless-stopped
