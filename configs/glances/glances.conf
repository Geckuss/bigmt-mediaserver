# Glances web/API server hardening.
#
# Without this file Glances runs on every default and warns at startup:
# CORS "*", and no Host header validation. Both are real here - the API is on
# host network :61208, so anything on the LAN can read /api/4/all, which
# includes the process list, every mount, the interface list, and the full
# container inventory (docker.sock is mounted into this container).
#
# Glances splits the Host header on ":" before matching and uses
# fnmatch.fnmatchcase, so list hosts WITHOUT ports. Wildcards are supported.
# A Host that does not match is rejected with 400.

[outputs]
# Homepage is the only consumer. It calls this API server-side from its
# container via host.docker.internal:61208, so that name MUST stay here or
# every glances tile breaks with 400. host.docker.internal is a container
# DNS alias, not a real hostname - that is why it is in the list at all.
webui_allowed_hosts=host.docker.internal,localhost,127.0.0.1,bigmt,bigmt.tahr-fort.ts.net,192.168.0.40,100.115.115.115

# No browser ever talks to this API directly - Homepage proxies it - so there
# is no legitimate cross-origin caller and the default "*" is pure exposure.
# Empty means Glances sends no CORS headers at all, which also clears the
# startup warning.
cors_origins=
