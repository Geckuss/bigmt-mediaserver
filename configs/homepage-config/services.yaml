    - Immich:
        icon: immich.png
        href: https://immich.example.com
        description: Photo Management
        server: my-docker
        container: immich_server
        widget:
          type: immich
          url: http://host.docker.internal:2283
          key: <IMMICH_API_KEY>
          version: 2
    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.example.com
        description: DNS Ad Blocker
        server: my-docker
        container: pihole
        widget:
          type: pihole
          url: http://host.docker.internal:80
          version: 6
          key: <PIHOLE_PASSWORD>
    - Komodo:
        icon: komodo.png
        href: https://komodo.example.com
        description: Docker Management
        server: my-docker
        container: komodo-core-1
        widget:
          # Homepage has a NATIVE komodo widget (type: komodo). It needs an
          # API key + secret, which in Komodo 2.3.3 are NOT permission-scoped:
          # setting every resource type to Read, then to None, still allowed
          # /execute/*, and a DeployStack issued with such a key succeeded.
          # So this key can deploy or destroy any stack on the box. The live
          # services.yaml holds the real values; never commit them.
          #
          # Note: there is NO per-service docker-stats widget in Homepage --
          # `type: docker-stats` renders "Missing Widget Type". Per-container
          # CPU/mem for a single service is not offered; the `container:` field
          # above gives the status dot only.
          type: komodo
          url: http://host.docker.internal:9120
          key: <KOMODO_API_KEY>
          secret: <KOMODO_API_SECRET>
          showSummary: true
          fields:
            - servers
            - stacks
            - containers
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime.example.com
        description: Status Monitoring
        server: my-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://host.docker.internal:3001
          slug: default

