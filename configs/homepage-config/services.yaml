# NOTE: API keys/passwords and hostnames are sanitized with placeholders.
# The live values live only on the server at ${CONFIGS}/homepage-config/services.yaml.
# Glances tiles talk to the host-network Glances at host.docker.internal:61208 (API v4).
# App widgets reach host-mode/other services via host.docker.internal:<port>.

- System:
    - CPU:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: cpu
          chart: true
          refreshInterval: 5000
          pointsLimit: 15
    - Memory:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: memory
          chart: true
          refreshInterval: 5000
          pointsLimit: 15
    - Disk Usage:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: fs:/data
          chart: true
          refreshInterval: 10000
    - CPU Temp:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: sensor:Package id 0
          chart: true
          refreshInterval: 10000
    - Network:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: network:enp2s0
          chart: true
          refreshInterval: 5000
          pointsLimit: 15
    - Disk I/O:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: disk:sda
          chart: true
          refreshInterval: 5000
          pointsLimit: 15

- Apps:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.example.com
        description: Media Server
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://host.docker.internal:8096
          key: <JELLYFIN_API_KEY>
          # Jellyfin >= 10.12 must use widget v2. v1 (the default) calls the
          # legacy /emby/ routes and ?api_key= auth, which Jellyfin 12 removed,
          # so the widget fails with a 404 on /emby/Items/Counts.
          version: 2
          enableBlocks: true
          enableNowPlaying: false
    - Jellyseerr:
        icon: jellyseerr.png
        href: https://jellyseerr.example.com
        description: Media Requests
        server: my-docker
        container: jellyseerr
        widget:
          type: jellyseerr
          url: http://host.docker.internal:5055
          key: <JELLYSEERR_API_KEY>
    - Radarr:
        icon: radarr.png
        href: https://radarr.example.com
        description: Movies
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://host.docker.internal:7878
