server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Valid names for youtube-plugin are: ANDROID_MUSIC, ANDROID_VR, IOS, MUSIC,
    # MWEB, TV, TVHTML5EMBEDDED, WEB, WEBEMBEDDED. Unrecognised names are
    # dropped silently, so the plugin falls back to its own defaults and you
    # lose control over which clients get used.
    #
    # TV and MUSIC are the OAuth-capable clients, and the only ones that get
    # past YouTube's "this video requires login" wall. Without a working OAuth
    # session every remaining client fails. IOS and MWEB are extra fallbacks.
    clients:
      - TV
      - MUSIC
      - ANDROID_VR
      - ANDROID_MUSIC
      - IOS
      - MWEB
      - WEB
      - WEBEMBEDDED
    clientOptions:
      WEB:
        # was false/false, which guaranteed WEB could never resolve a track:
        # it just logged "Video loading is disabled for this client"
        playback: true
        videoLoading: true
      WEBEMBEDDED:
        playlistLoading: false
        searching: false
    remoteCipher:
      url: "http://yt-cipher:8001"
    # oauth lives only on the host, in ${CONFIGS}/vocard/lavalink/application.yml.
    # The refresh token is a real Google credential and is never committed.
    # skipInitialization must stay false, or every Lavalink restart silently
    # drops the OAuth session and playback dies until the next manual restart.
    oauth:
      enabled: true
      # leave refreshToken empty for the first run
      refreshToken: ""
      skipInitialization: false
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
    spotify:
      clientId: "YOUR_SPOTIFY_CLIENT_ID"
      clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET"
      countryCode: "FI"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
      preferAnonymousToken: true
      customTokenEndpoint: "http://spotify-tokener:49152/api/token"

lavalink:
  plugins:
    # A `main` snapshot, not a release, and deliberately so. 1.18.2 (2026-07-27)
    # is still the newest published release, but YouTube changed player behaviour
    # after it and every client then fails to resolve a playable stream:
    #   AllClientsFailedException: (yts.version: 1.18.2) All clients failed
    #   TVHTML5            The page needs to be reloaded
    #   ANDROID_VR/MUSIC   This video requires login
    #   IOS                Invalid status code for player api response: 400
    #   WEB                No supported audio streams available
    #   WEB_EMBEDDED_PLAYER This video is unavailable
    # Search and metadata keep working, so this looks healthy until playback is
    # actually attempted. That is upstream breakage, not a misconfiguration: the
    # TVHTML5 playability fix (youtube-source PR #233, issue #241) only ever
    # landed on `main`. The maintainer's standing advice is to use a remote cipher
    # server, which remoteCipher below already does.
    #
    # Pinned by commit hash rather than a rolling -SNAPSHOT, so this stays
    # reproducible: the snapshots repo serves that exact coordinate forever, and a
    # restart cannot silently pull different plugin code. Bump it deliberately when
    # a release catches up, and re-check with scripts/update-vocard-lavalink.sh
    # (which skips this entry rather than reverting it -- see the note there).
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      snapshot: false
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
