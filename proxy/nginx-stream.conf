# Valheim UDP relay. Runs on oci as a Docker container, deliberately NOT inside
# Caddy and NOT touching the system nginx package (that one is installed but
# disabled; Caddy owns oci's HTTP/HTTPS).
#
# Why this exists:
#   bigmt has no public IP. It sits on <BIGMT_LAN_IP> behind the home router, and
#   the router forwards no game ports - verified by sending UDP from the internet
#   to the WAN address on 2456/2457 and confirming with tcpdump on bigmt that
#   nothing arrives. oci does have a public IP, so oci accepts the game packets
#   and relays them over Tailscale to bigmt. valheim.example.com already resolves
#   to oci, so the hostname needs no DNS change.
#
# Why not Caddy:
#   Valheim is UDP - 2456 gameplay, 2457 A2S query. Caddy speaks HTTP only, so no
#   amount of configuration makes it carry this traffic. nginx's stream module does.
#
# Why not Valheim crossplay (-crossplay):
#   Crossplay relays through PlayFab and is the official "no port forwarding"
#   answer, but it is incompatible with BepInEx. This server is modded, so
#   enabling it would silently drop the entire mod stack.
#
# Consequence - this does NOT put the server in the Steam community browser:
#   Valve A2S-queries the address the server advertises, which behind NAT is the
#   router's WAN address, not this host. The query fails and Steam drops the entry
#   within ~5 minutes. Players connect with the Join IP field instead. Keep
#   SERVER_PUBLIC=false; setting it true only produces an entry that vanishes.

# No load_module line for stream: in the official nginx image the core
# ngx_stream_module is compiled into the binary. Only its geoip/js submodules ship
# as .so files under /usr/lib/nginx/modules, so adding load_module here fails with
# dlopen() ... No such file or directory.

user  nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format relay '$remote_addr [$time_local] $protocol $status '
                     '$bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /var/log/nginx/stream-access.log relay;

    # 2456 = gameplay, 2457 = A2S server query. The tailnet ACL is allow-all, so
    # no Tailscale policy change is needed to permit oci -> bigmt here.
    #
    # proxy_timeout matters: nginx defaults to 10s, which would tear down an idle
    # player well before Valheim's own keepalive interval.
    server {
        listen 0.0.0.0:2456 udp;
        proxy_pass <BIGMT_TAILSCALE_IP>:2456;
        proxy_timeout 300s;
    }
    server {
        listen 0.0.0.0:2457 udp;
        proxy_pass <BIGMT_TAILSCALE_IP>:2457;
        proxy_timeout 300s;
    }
}
